---
# Localhost-mode port of legacy entry_point/30-mongo-init-replica.yml.
# mongodb_primary_ip, mongodb_username, and mongodb_password arrive as extra vars.
- name: Initialize the MongoDB 8.0 replica set
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars_files:
    - ../roles/mongodb/defaults/main.yml

  vars:
    mongodb_repl_set_name: rs0
    mongodb_admin_user: "{{ mongodb_username }}"
    mongodb_admin_pass: "{{ mongodb_password }}"
    mongodb_init_timeout: 120

  pre_tasks:
    - name: Require replica initialization inputs
      ansible.builtin.assert:
        that:
          - mongodb_primary_ip is defined
          - mongodb_primary_ip | length > 0
          - mongodb_username is defined
          - mongodb_username | length > 0
          - mongodb_password is defined
          - mongodb_password | length > 0
        fail_msg: mongodb_primary_ip, mongodb_username, and mongodb_password are required extra vars
      no_log: true

  roles:
    - role: ../roles/init_replica_nodes

  # A play-level roles: entry ignores tasks_from and runs tasks/main.yml, so
  # the oplog task file is imported here, after replica initialization.
  tasks:
    - name: Converge the live MongoDB oplog size
      ansible.builtin.import_role:
        name: ../roles/mongodb
        tasks_from: oplog

  post_tasks:
    - name: Wait for authenticated PRIMARY status
      ansible.builtin.command:
        argv:
          - mongosh
          - --quiet
          - --tls
          - --tlsAllowInvalidCertificates
          - --host
          - "localhost:{{ mongodb_port }}"
          - --username
          - "{{ mongodb_admin_user }}"
          - --password
          - "{{ mongodb_admin_pass }}"
          - --authenticationDatabase
          - admin
          - --eval
          # hello reports this member's view of the PRIMARY without throwing
          # while an election is in progress, so the wait stays in the script.
          - >-
            let failure = "wait_primary PrimaryNotElected";
            try {
              for (let attempt = 1; attempt <= 10; attempt++) {
                const hello = db.getSiblingDB("admin").runCommand({hello: 1});
                if (hello.isWritablePrimary && hello.primary === "{{ mongodb_primary_ip }}:{{ mongodb_port }}") {
                  print(hello.primary + " PRIMARY");
                  failure = null;
                  break;
                }
                sleep(6000);
              }
            } catch (error) {
              failure = "wait_primary " + String(error.codeName || error.name).replace(/[^A-Za-z0-9_]/g, "");
            }
            if (failure !== null) {
              print("CONFIG0_ERROR: " + failure);
              quit(1);
            }
      register: authenticated_primary_status
      changed_when: false
      # no_log hides the output, so the next task reports a failure with the
      # script's sanitized CONFIG0_ERROR line only. The wait loop is in the
      # script: an Ansible until loop marks the task failed when it runs out.
      failed_when: false
      no_log: true

    - name: Fail with the sanitized authenticated PRIMARY error
      ansible.builtin.fail:
        msg: >-
          {{ authenticated_primary_status.stdout_lines | select('match', '^CONFIG0_ERROR: ') | first
          | default('CONFIG0_ERROR: wait_primary exited before the script reported') }}
          (exit {{ authenticated_primary_status.rc }})
      when: authenticated_primary_status.rc != 0

    - name: Display authenticated PRIMARY status
      ansible.builtin.debug:
        msg: "{{ authenticated_primary_status.stdout_lines }}"

  tags:
    - mongodb_repl
    - replica_init
