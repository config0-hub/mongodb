---
- name: Validate desired MongoDB oplog size
  ansible.builtin.assert:
    that:
      - mongodb_repl_oplog_size is number
      - mongodb_repl_oplog_size | float >= 990
      - mongodb_repl_oplog_size | float <= 1048576
    fail_msg: mongodb_repl_oplog_size must be a number from 990 through 1048576 MB

- name: Observe authenticated live MongoDB oplog state before resize
  ansible.builtin.command:
    argv:
      - mongosh
      - --quiet
      - --tls
      - --tlsAllowInvalidCertificates
      - --host
      - "localhost:{{ mongodb_port }}"
      - --username
      - "{{ mongodb_admin_user }}"
      - --password
      - "{{ mongodb_admin_pass }}"
      - --authenticationDatabase
      - admin
      - --eval
      - >-
        try {
          const stats = db.getSiblingDB("local").runCommand({collStats: "oplog.rs"});
          print(JSON.stringify({version: db.version(), max_size_bytes: Number(stats.maxSize)}));
        } catch (error) {
          print("CONFIG0_ERROR: observe_oplog_before " + String(error.codeName || error.name).replace(/[^A-Za-z0-9_]/g, ""));
          quit(1);
        }
  register: mongodb_oplog_before_result
  changed_when: false
  # no_log hides the output, so the next task reports a failure with the
  # script's sanitized CONFIG0_ERROR line only.
  failed_when: false
  no_log: true

- name: Fail with the sanitized oplog before-resize read error
  ansible.builtin.fail:
    msg: >-
      {{ mongodb_oplog_before_result.stdout_lines | select('match', '^CONFIG0_ERROR: ') | first
      | default('CONFIG0_ERROR: observe_oplog_before exited before the script reported') }}
      (exit {{ mongodb_oplog_before_result.rc }})
  when: mongodb_oplog_before_result.rc != 0

- name: Record live MongoDB oplog state before resize
  ansible.builtin.set_fact:
    mongodb_oplog_before: "{{ mongodb_oplog_before_result.stdout | from_json }}"

- name: Validate MongoDB oplog resize version
  ansible.builtin.assert:
    that:
      - mongodb_oplog_before.version is version('3.6', '>=')
    fail_msg: >-
      replSetResizeOplog requires MongoDB 3.6 or newer;
      found {{ mongodb_oplog_before.version }}

- name: Resize live MongoDB oplog when its size differs
  ansible.builtin.command:
    argv:
      - mongosh
      - --quiet
      - --tls
      - --tlsAllowInvalidCertificates
      - --host
      - "localhost:{{ mongodb_port }}"
      - --username
      - "{{ mongodb_admin_user }}"
      - --password
      - "{{ mongodb_admin_pass }}"
      - --authenticationDatabase
      - admin
      - --eval
      - >-
        try {
          db.adminCommand({replSetResizeOplog: 1, size: Double({{ mongodb_repl_oplog_size }})});
        } catch (error) {
          print("CONFIG0_ERROR: resize_oplog " + String(error.codeName || error.name).replace(/[^A-Za-z0-9_]/g, ""));
          quit(1);
        }
  register: mongodb_oplog_resize_result
  when: >-
    mongodb_oplog_before.max_size_bytes | int !=
    (mongodb_repl_oplog_size | float * 1024 * 1024) | int
  changed_when: false
  # no_log hides the output, so the next task reports a failure with the
  # script's sanitized CONFIG0_ERROR line only.
  failed_when: false
  no_log: true

- name: Fail with the sanitized oplog resize error
  ansible.builtin.fail:
    msg: >-
      {{ mongodb_oplog_resize_result.stdout_lines | select('match', '^CONFIG0_ERROR: ') | first
      | default('CONFIG0_ERROR: resize_oplog exited before the script reported') }}
      (exit {{ mongodb_oplog_resize_result.rc }})
  when: mongodb_oplog_resize_result is not skipped and mongodb_oplog_resize_result.rc != 0

- name: Observe authenticated live MongoDB oplog state after resize
  ansible.builtin.command:
    argv:
      - mongosh
      - --quiet
      - --tls
      - --tlsAllowInvalidCertificates
      - --host
      - "localhost:{{ mongodb_port }}"
      - --username
      - "{{ mongodb_admin_user }}"
      - --password
      - "{{ mongodb_admin_pass }}"
      - --authenticationDatabase
      - admin
      - --eval
      - >-
        try {
          const stats = db.getSiblingDB("local").runCommand({collStats: "oplog.rs"});
          print(JSON.stringify({version: db.version(), max_size_bytes: Number(stats.maxSize)}));
        } catch (error) {
          print("CONFIG0_ERROR: observe_oplog_after " + String(error.codeName || error.name).replace(/[^A-Za-z0-9_]/g, ""));
          quit(1);
        }
  register: mongodb_oplog_after_result
  changed_when: false
  # no_log hides the output, so the next task reports a failure with the
  # script's sanitized CONFIG0_ERROR line only.
  failed_when: false
  no_log: true

- name: Fail with the sanitized oplog after-resize read error
  ansible.builtin.fail:
    msg: >-
      {{ mongodb_oplog_after_result.stdout_lines | select('match', '^CONFIG0_ERROR: ') | first
      | default('CONFIG0_ERROR: observe_oplog_after exited before the script reported') }}
      (exit {{ mongodb_oplog_after_result.rc }})
  when: mongodb_oplog_after_result.rc != 0

- name: Record live MongoDB oplog state after resize
  ansible.builtin.set_fact:
    mongodb_oplog_after: "{{ mongodb_oplog_after_result.stdout | from_json }}"

- name: Require the desired live MongoDB oplog size
  ansible.builtin.assert:
    that:
      - >-
        mongodb_oplog_after.max_size_bytes | int ==
        (mongodb_repl_oplog_size | float * 1024 * 1024) | int
    fail_msg: >-
      MongoDB oplog size is
      {{ mongodb_oplog_after.max_size_bytes | int }} bytes after resize;
      expected {{ (mongodb_repl_oplog_size | float * 1024 * 1024) | int }} bytes

- name: Report observed live MongoDB oplog change
  ansible.builtin.debug:
    msg: >-
      MongoDB oplog size moved from
      {{ mongodb_oplog_before.max_size_bytes | int }} bytes to
      {{ mongodb_oplog_after.max_size_bytes | int }} bytes
  changed_when: >-
    mongodb_oplog_before.max_size_bytes | int !=
    mongodb_oplog_after.max_size_bytes | int
