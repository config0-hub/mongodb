---
# Ported from legacy ubuntu_vendor_setup roles/mongodb.
# Modernizations: MongoDB 8.0 from the native noble repo (legacy inverted
# version pick and the noble->jammy repo hack DELETED); localhost mode.

- name: Update system packages
  apt:
    update_cache: yes
  become: true

- name: Install dependencies
  apt:
    name:
      - gnupg
      - curl
      - haveged
    state: present
  become: true

- name: Ensure haveged is running for entropy
  service:
    name: haveged
    state: started
    enabled: yes
  become: true

- name: Remove existing MongoDB repository files
  shell: rm -f /etc/apt/sources.list.d/mongodb*.list
  become: true
  changed_when: false

- name: Download MongoDB GPG key and add to keyring
  shell: |
    set -e
    curl -sL https://www.mongodb.org/static/pgp/server-{{ mongodb_repo_version }}.asc | \
    gpg --dearmor > /usr/share/keyrings/mongodb-server-{{ mongodb_repo_version }}.gpg
  args:
    creates: "/usr/share/keyrings/mongodb-server-{{ mongodb_repo_version }}.gpg"
  become: true

- name: Add MongoDB repository (native noble)
  copy:
    content: "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-{{ mongodb_repo_version }}.gpg ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/{{ mongodb_repo_version }} multiverse\n"
    dest: "/etc/apt/sources.list.d/mongodb-org-{{ mongodb_repo_version }}.list"
    owner: root
    group: root
    mode: 0644
  become: true

- name: Install MongoDB packages
  apt:
    name: mongodb-org
    state: present
    update_cache: yes
  become: true
  register: mongodb_install
  retries: 3
  delay: 5
  until: mongodb_install is success

- name: Create MongoDB data directory
  file:
    path: "{{ mongodb_dbpath }}"
    state: directory
    owner: "{{ mongodb_user }}"
    group: "{{ mongodb_group }}"
    mode: 0755
    recurse: yes
  become: true

- name: Create MongoDB log directory
  file:
    path: "{{ mongodb_logpath | dirname }}"
    state: directory
    owner: "{{ mongodb_user }}"
    group: "{{ mongodb_group }}"
    mode: 0755
  become: true

- name: Create MongoDB security directory
  file:
    path: "{{ mongodb_security_path }}"
    state: directory
    owner: "{{ mongodb_user }}"
    group: "{{ mongodb_group }}"
    mode: 0755
  become: true

- name: Create MongoDB keyfile from variable
  copy:
    content: "{{ mongodb_keyfile | b64decode }}"
    dest: "{{ mongodb_keyfile_path }}"
    owner: "{{ mongodb_user }}"
    group: "{{ mongodb_group }}"
    mode: 0600
  become: true
  when: mongodb_keyfile is defined and mongodb_keyfile | length > 0

- name: Create MongoDB PEM from variable
  copy:
    content: "{{ mongodb_pem | b64decode }}"
    dest: "{{ mongodb_pem_path }}"
    owner: "{{ mongodb_user }}"
    group: "{{ mongodb_group }}"
    mode: 0600
  become: true
  when: mongodb_pem is defined and mongodb_pem | length > 0

- name: Create MongoDB configuration file
  template:
    src: mongod.conf.j2
    dest: /etc/mongod.conf
    owner: root
    group: root
    mode: 0644
  become: true
  notify: restart mongodb

# Apply the notified restart before the explicit stop/start sequence below.
# This keeps the playbook's final port check after its last service restart.
- name: Apply MongoDB configuration handlers
  meta: flush_handlers

- name: Stop MongoDB service (if running)
  service:
    name: mongod
    state: stopped
  become: true

- name: Start and enable MongoDB service
  service:
    name: mongod
    state: started
    enabled: yes
  become: true
  register: start_result
  retries: 3
  delay: 5
  until: start_result is success

- name: Wait for MongoDB to be available
  wait_for:
    host: 127.0.0.1
    port: "{{ mongodb_port }}"
    delay: 5
    timeout: 60
  become: true

- name: Verify MongoDB installation
  shell: mongod --version
  become: true
  register: version_check
  changed_when: false

- name: Show MongoDB verification results
  debug:
    msg: "MongoDB installation verified successfully. Version: {{ version_check.stdout_lines[0] }}"
