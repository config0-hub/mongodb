---
# Localhost-mode port of legacy entry_point/20-mongo-setup.yml.
# Run per node: ansible-playbook -i localhost, -c local 20-mongo-setup.yml \
#   -e mongodb_keyfile=<b64> -e mongodb_pem=<b64> [-e mongodb_bind_ip=...]
- name: Install and configure MongoDB 8.0
  hosts: localhost
  connection: local
  become: true
  roles:
    - role: ../roles/mongodb
      mongodb_repl_set_name: rs0
      mongodb_wt_cache_size_gb: "{{ ((ansible_memtotal_mb * 0.5) / 1024) | round(0, 'floor') | int }}"
      mongodb_featureCompatibilityVersion: "8.0"
  tags:
    - mongodb_install
